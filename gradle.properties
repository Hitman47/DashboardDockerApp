# Avast Web Shield dechiffre le HTTPS et re-signe avec sa propre autorite, qui
# vit dans le magasin Windows mais pas dans le cacerts de la JVM. Sans cette
# ligne, toute resolution de dependance echoue en PKIX path building failed.
# Windows-ROOT fait lire le magasin Windows a Java, sans modifier aucun fichier.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
