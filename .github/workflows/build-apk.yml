name: Build APK

# - push sur main : APK debug en artefact (onglet Actions → run → Artifacts)
# - tag v* : APK attaché à une Release GitHub (signé si les secrets de
#   signature existent, sinon APK debug — installable, mais une future version
#   signée ne pourra pas s'installer par-dessus sans désinstaller).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le runner ubuntu-latest embarque déjà le SDK Android (ANDROID_HOME) ;
      # l'AGP télécharge lui-même la plateforme 36 et les build-tools manquants.

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties porte un réglage propre au poste Windows (magasin de
      # certificats Avast) qui n'existe pas sous Linux.
      - name: Adapt gradle.properties for Linux
        run: sed -i 's/ -Djavax.net.ssl.trustStoreType=Windows-ROOT//' gradle.properties

      - name: Restore signing key (if configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "$SIGNED" = "1" ]; then SRC=app/build/outputs/apk/release/app-release.apk; OUT="DockerDashboard-$VERSION.apk";
          else SRC=app/build/outputs/apk/debug/app-debug.apk; OUT="DockerDashboard-$VERSION-debug.apk"; fi
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
