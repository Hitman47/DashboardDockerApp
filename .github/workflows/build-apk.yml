name: Build check

# Vérifie que le projet compile et dépose un APK debug en artefact (onglet
# Actions → run → Artifacts). Volontairement AUCUN secret ici : la version
# release signée est produite sur le poste avec tools/publier.ps1, qui crée la
# Release GitHub et y attache l'APK. La clé de signature ne quitte jamais le PC.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Le runner ubuntu-latest embarque déjà le SDK Android (ANDROID_HOME) ;
      # l'AGP télécharge lui-même la plateforme et les build-tools manquants.
      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties porte un réglage propre au poste Windows (magasin de
      # certificats Avast) qui n'existe pas sous Linux.
      - name: Adapt gradle.properties for Linux
        run: sed -i 's/ -Djavax.net.ssl.trustStoreType=Windows-ROOT//' gradle.properties

      - name: Build (debug)
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "DockerDashboard-$VERSION-debug.apk"
          echo "file=DockerDashboard-$VERSION-debug.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
